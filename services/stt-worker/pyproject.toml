[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-voice-flow-stt"
version = "0.1.0"
description = "LocalVoiceFlow speech-to-text worker: a resident MLX Whisper process speaking JSON Lines."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mlx-whisper>=0.4.3",
    "numpy",
]

[project.scripts]
lvf-stt = "lvf_stt.__main__:main"

[tool.setuptools]
packages = ["lvf_stt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
